<!-- SECTION 1: COLOR GENETICS EXPLORER -->
<div class="container">
  <!-- Dropdowns -->
  <div class="selectors">
    <select id="baseColor">
      <option value="">Select Base Color</option>
      <option value="Black">Black</option>
      <option value="Brown">Brown</option>
    </select>

    <select id="pattern" disabled>
      <option value="">Select Pattern</option>
      <option value="solid">Solid</option>
      <option value="white">White</option>
      <option value="Katmoget">Katmoget</option>
      <option value="Gulmoget">Gulmoget</option>
      <option value="Fading">Fading</option>
    </select>

    <select id="spots" disabled>
      <option value="">Select Spotting</option>
      <option value="yes">Spotted</option>
      <option value="no">Non-Spotted</option>
    </select>
  </div>

  <!-- Image Display -->
  <div class="image-container">
    <img id="sheepImage" src="images/Blank_.png" alt="Shetland sheep" />
  </div>

  <!-- Description Wrapper (MUST BE A DIV, NOT A P) -->
  <div id="description" class="description">
    <p>Select a base color to start learning about Shetland sheep genetics.</p>
  </div>

  <!-- Buttons Wrapper (MUST BE A DIV) -->
  <div id="sheepButtons">
    <button id="buttonThis">This is my sheep</button>
    <button id="buttonDifferent">My sheep looks different</button>
  </div>
</div>
